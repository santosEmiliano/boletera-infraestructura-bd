services:
  postgres:
    image: postgres:16
    container_name: postgres-pc2
    restart: unless-stopped
    # Parámetros de la replicación. En PostgreSQL 16 ya son los valores por
    # defecto; se ponen explícitos para que no dependan de la versión.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - listen_addresses=*
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: boletera
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../postgres/init:/docker-entrypoint-initdb.d:ro
      - ../../postgres/scripts:/scripts:ro
    extra_hosts:
      - "pc1:${PC1_IP}"
      - "pc2:${PC2_IP}"
      - "pc3:${PC3_IP}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boletera"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
    name: boletera_pgdata
