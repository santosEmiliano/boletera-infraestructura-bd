services:
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.21.0
    container_name: mysqld-exporter-pc2
    restart: unless-stopped
    command:
      - --mysqld.address=pc2:3306
      - --mysqld.username=exporter
      - --collect.perf_schema.replication_group_members
      - --collect.perf_schema.replication_group_member_stats
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_MYSQL_PASSWORD}
    ports:
      - "9104:9104"
    extra_hosts:
      - "pc1:${PC1_IP}"
      - "pc2:${PC2_IP}"
      - "pc3:${PC3_IP}"

  # Un exporter por miembro de shard, en conexión directa (sin seguir al replica
  # set): así cada PC reporta su propio miembro y en Grafana se ve cuál es
  # PRIMARY y cuál SECONDARY. Sin usuario mientras Mongo no tenga auth.
  mongodb-exporter-shard-a:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter-shard-a-pc2
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://pc2:27018
      - --mongodb.direct-connect
      - --collector.diagnosticdata
      - --collector.replicasetstatus
      - --collector.dbstats
      - --compatible-mode
      - --web.listen-address=:9216
    ports:
      - "9216:9216"
    extra_hosts:
      - "pc1:${PC1_IP}"
      - "pc2:${PC2_IP}"
      - "pc3:${PC3_IP}"

  mongodb-exporter-shard-b:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter-shard-b-pc2
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://pc2:27020
      - --mongodb.direct-connect
      - --collector.diagnosticdata
      - --collector.replicasetstatus
      - --collector.dbstats
      - --compatible-mode
      - --web.listen-address=:9217
    ports:
      - "9217:9217"
    extra_hosts:
      - "pc1:${PC1_IP}"
      - "pc2:${PC2_IP}"
      - "pc3:${PC3_IP}"
