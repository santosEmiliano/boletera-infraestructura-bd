services:
  mysql:
    image: mysql:8.0
    container_name: mysql-pc3
    restart: unless-stopped
    # Docker Desktop en Windows monta los archivos con permisos 777 y MySQL ignora
    # un .cnf que cualquiera puede escribir. Se copia con 644 antes de arrancar.
    entrypoint: ["sh", "-c", "install -m 644 /boletera/boletera.cnf /etc/mysql/conf.d/boletera.cnf && exec docker-entrypoint.sh mysqld"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
      - "33061:33061"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../mysql/conf/pc3.cnf:/boletera/boletera.cnf:ro
      - ../../mysql/scripts:/scripts:ro
    networks:
      red:
        ipv4_address: 10.210.0.10
    extra_hosts:
      - "pc1:${PC1_IP}"
      - "pc2:${PC2_IP}"
      # Su propio nombre apunta a la IP del contenedor: Group Replication solo
      # acepta en local_address una dirección que sea suya. Los otros nodos
      # llegan por la IP física y el puerto publicado.
      - "pc3:10.210.0.10"
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  red:
    name: boletera_red_mysql
    ipam:
      config:
        # Fuera de los rangos 172.17-172.31 que Docker reparte a otros proyectos
        - subnet: 10.210.0.0/24

volumes:
  mysql_data:
    name: boletera_mysql_data
